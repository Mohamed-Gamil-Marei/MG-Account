name: Build Desktop Application (Electron)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup.exe (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

      - name: Build Web & Server Dist
        run: npm run build

      - name: Package Windows Desktop App (NSIS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --x64

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MG-Account-Windows-Setup-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 14

  build-macos:
    name: Build macOS DMG (x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web & Server Dist
        run: npm run build

      - name: Package macOS Desktop App (DMG)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg --universal

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MG-Account-macOS-Universal-DMG
          path: |
            release/*.dmg
            release/*.blockmap
            release/latest-mac.yml
          retention-days: 14
